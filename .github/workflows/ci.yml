name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel   # сразу с make, fakeroot и ключами pacman
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Пакеты
        run: |
          pacman -Syu --noconfirm --needed \
            git python pyside6 python-dbus python-gobject \
            pipewire pipewire-audio wl-clipboard libnotify libpulse

      - uses: actions/checkout@v4

      - name: Линт
        run: make lint

      - name: Тесты
        run: |
          set +e
          output=$(make test 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ]; then
            # Лог приватный, аннотации — публичные: выносим причину в них.
            echo "$output" | grep -E "^(FAIL|ERROR|Traceback|  File |AssertionError|[A-Za-z]*Error)" \
              | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $code

      - name: Сборка пакета (без установки)
        run: |
          set +e
          useradd -m builder
          chown -R builder:builder .
          output=$(su builder -c 'makepkg -f --nocheck' 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ]; then
            echo "$output" | tail -25 | while IFS= read -r line; do echo "::error::${line:- }"; done
          fi
          exit $code
