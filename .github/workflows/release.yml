name: release

# Тег v* → пакет Arch и черновик релиза на GitHub с приложенным .pkg.tar.zst.
# Остаётся нажать Publish в разделе Releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Пакеты
        run: |
          pacman -Syu --noconfirm --needed \
            git github-cli python pyside6 python-dbus python-gobject \
            pipewire pipewire-audio wl-clipboard libnotify libpulse

      - uses: actions/checkout@v4

      - name: Линт и тесты
        run: make lint && make test

      - name: Сборка пакета
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c 'makepkg -f --nocheck'

      - name: Заметки из CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "whisper-station $version" > release-notes.md
          fi
          {
            echo
            echo "## Установка"
            echo
            echo '```sh'
            echo "git clone https://github.com/${GITHUB_REPOSITORY}.git whisper-station"
            echo "cd whisper-station && ./install.sh"
            echo '```'
          } >> release-notes.md

      - name: Черновик релиза
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "whisper-station $version" \
            --notes-file release-notes.md \
            whisper-station-*.pkg.tar.zst
