[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-station"
version = "0.4.0"
description = "Локальная диктовка для KDE Plasma 6 / Wayland: хоткей, HUD, вставка текста"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = [
    "PySide6>=6.6",
    "dbus-python>=1.3",
    "PyGObject>=3.44",
]

[project.scripts]
whisper-station = "whisper_station.cli:main"

[tool.setuptools]
packages = ["whisper_station", "whisper_station.server"]
